# Core 子仓库的独立 Ruff 配置。
#
# 主仓库 pyproject.toml 的 ruff exclude 与 pytest testpaths 都把 ECL/game 排除在外，
# 因此下沉到 Core 的代码需要本配置才能进入质量门禁。
#
# 注意：Core 的测试导入的是 ECL.game.* 命名空间，依赖主仓库目录结构，无法在 Core
# 仓库内独立运行；测试门禁由主仓库 CI 的 `pytest ECL/game/tests` 步骤承担。
target-version = "py311"
line-length = 120
indent-width = 4

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "C90", # mccabe complexity
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # 行宽由 formatter 负责
    "N818",   # 异常名以 Error 结尾
    "N999",   # 模块名大小写（Core 沿用 PascalCase 既有约定）
    "RUF001", # 中文标点误报
    "RUF002",
    "RUF003",
    "RUF012",
]

[lint.mccabe]
max-complexity = 12

[lint.per-file-ignores]
# 以下为本次重构前既存的实现文件。按重构方案「不跨模块大规模重写 Core」的要求保持
# 原样，仅豁免既存违规；文件被修改时应逐步收敛并从本列表移除。
# 新增文件与下沉文件不在豁免范围，必须通过全量检查。
"Core/Downloader.py" = ["ALL"]
"Core/ECLauncherCore.py" = ["ALL"]
"Core/FilesChecker.py" = ["ALL"]
"Core/GetGames.py" = ["ALL"]
"Core/InstancesManager.py" = ["ALL"]
"Core/Libs.py" = ["ALL"]
"Core/LoaderInstaller.py" = ["ALL"]
"Core/MicrosoftAuth.py" = ["ALL"]
"Core/NetLibs.py" = ["ALL"]
"Core/YggdrasilAuth.py" = ["ALL"]
"Utils/JavaScanner.py" = ["ALL"]
"Utils/SearchMinecraft.py" = ["ALL"]
"auth/__init__.py" = ["ALL"]
"tests/test_files_checker.py" = ["ALL"]
"tests/test_java_probe.py" = ["ALL"]